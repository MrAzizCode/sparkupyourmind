<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | SparkUpYourMind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="SparkUpYourMind home">
      <span class="brand-mark">S</span>
      <span>SparkUpYourMind</span>
    </a>
    <div class="header-doodles" aria-hidden="true">
      <span class="doodle-loop"></span>
      <span class="doodle-star">+</span>
      <span class="doodle-note">idea?</span>
    </div>

    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="primary-nav" id="primary-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="products.html" class="active">Products</a>
      <button class="cart-pill" type="button" data-cart-open>
        Cart <span data-cart-count>0</span>
      </button>
    </nav>
  </header>

  <main>
    <section class="page-title shop-title">
      <span class="page-doodle page-doodle-one" aria-hidden="true"></span>
      <span class="page-doodle page-doodle-two" aria-hidden="true">make / rest / repeat</span>
      <p class="eyebrow">Shop support tools</p>
      <h1>Products for creative burnout recovery</h1>
      <p>
        Browse simple, student-friendly wellness products designed for creatives who want
        structure, calm, and fresh ideas.
      </p>
    </section>

    <section class="product-toolbar" aria-label="Product filters">
      <label>
        Search products
        <input type="search" data-product-search placeholder="Journal, cards, kit...">
      </label>
      <label>
        Sort by
        <select data-product-sort>
          <option value="featured">Featured</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
          <option value="name">Name</option>
        </select>
      </label>
    </section>

    <section class="products-grid" data-products-grid aria-live="polite"></section>
  </main>

  <dialog class="product-dialog" data-product-dialog>
    <button type="button" class="icon-button dialog-close" data-dialog-close aria-label="Close product details">x</button>
    <div class="dialog-content" data-dialog-content></div>
  </dialog>

  <aside class="cart-drawer" data-cart-drawer aria-hidden="true">
    <div class="cart-panel">
      <div class="cart-header">
        <h2>Your Cart</h2>
        <button type="button" class="icon-button" data-cart-close aria-label="Close cart">x</button>
      </div>
      <div class="cart-items" data-cart-items></div>
      <div class="cart-footer">
        <div class="cart-total">
          <span>Total</span>
          <strong data-cart-total>$0.00</strong>
        </div>
        <button class="button button-primary full-width" type="button" data-checkout>Checkout</button>
      </div>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
